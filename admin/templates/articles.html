{% extends "base.html" %}
{% block title %}文章管理 - 过敏知识图谱管理{% endblock %}
{% block content %}
<div class="page-header">
    <h2>📄 文章管理</h2>
    <p>查看和管理所有医学文献</p>
</div>
<div class="card">
    <div class="card-header">
        <h3 class="card-title">文章列表</h3>
        <div>
            <button class="btn btn-primary" onclick="uploadArticle()">➕ 上传文章</button>
            <button class="btn btn-secondary" onclick="loadArticles()">🔄 刷新</button>
        </div>
    </div>
    <div id="articles-loading" class="loading">加载中...</div>
    <div id="articles-container" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%">#</th>
                    <th style="width: 35%">标题</th>
                    <th style="width: 15%">观点数</th>
                    <th style="width: 15%">证据数</th>
                    <th style="width: 15%">状态</th>
                    <th style="width: 15%">操作</th>
                </tr>
            </thead>
            <tbody id="articles-tbody"></tbody>
        </table>
    </div>
    <div id="articles-empty" class="empty-state" style="display: none;">
        <div class="empty-state-icon">📄</div>
        <p>暂无文章数据</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function loadArticles() {
    const loading = document.getElementById('articles-loading');
    const container = document.getElementById('articles-container');
    const empty = document.getElementById('articles-empty');
    const tbody = document.getElementById('articles-tbody');
    loading.style.display = 'block';
    container.style.display = 'none';
    empty.style.display = 'none';
    try {
        const data = await apiCall('/api/articles/list');
        const articles = data.data;
        loading.style.display = 'none';
        if (articles.length === 0) {
            empty.style.display = 'block';
            return;
        }
        container.style.display = 'block';
        tbody.innerHTML = articles.map((article, index) => `
            <tr>
                <td>${index + 1}</td>
                <td><strong>${article.title || '未知'}</strong><div style="font-size: 12px; color: #999; margin-top: 4px;">${article.file ? article.file.split('/').pop() : ''}</div></td>
                <td>${article.claims ? article.claims.length : 0}</td>
                <td>${article.evidences ? article.evidences.length : 0}</td>
                <td>${article.uploaded ? '<span class="badge badge-success">✓ 已上传</span>' : '<span class="badge badge-warning">⏳ 待上传</span>'}</td>
                <td><button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="viewArticle(${index})">查看详情</button></td>
            </tr>
        `).join('');
    } catch (error) {
        loading.style.display = 'none';
        empty.style.display = 'block';
        showToast('加载失败: ' + error.message, 'error');
    }
}
function uploadArticle() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.pdf';
    input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const maxFilenameBytes = 255;
        const encoder = new TextEncoder();
        if (file.name !== file.name.split('/').pop()) {
            showToast('文件名不合法，请重新选择文件', 'error');
            return;
        }
        if (encoder.encode(file.name).length > maxFilenameBytes) {
            showToast('文件名过长，请缩短后再上传', 'error');
            return;
        }
        if (!file.name.toLowerCase().endsWith('.pdf')) {
            showToast('只支持 PDF 文件', 'error');
            return;
        }
        const formData = new FormData();
        formData.append('file', file);
        const loading = document.getElementById('articles-loading');
        loading.style.display = 'block';
        loading.textContent = '正在上传并执行 AI 分析，请稍候（约 1-2 分钟）...';
        try {
            const response = await fetch('/api/articles/upload', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) {
                showToast(data.message);
                loadArticles();
            } else {
                showToast('上传失败: ' + data.error, 'error');
            }
        } catch (error) {
            showToast('上传出错: ' + error.message, 'error');
        } finally {
            loading.style.display = 'none';
            loading.textContent = '加载中...';
        }
    };
    input.click();
}
function viewArticle(index) { alert('功能开发中...'); }
loadArticles();
</script>
{% endblock %}
