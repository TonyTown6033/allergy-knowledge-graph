{% extends "base.html" %}
{% block title %}观点管理 - 过敏知识图谱管理{% endblock %}
{% block content %}
<div class="page-header">
    <h2>💬 观点管理</h2>
    <p>查看和管理所有提取的医学观点</p>
</div>
<div class="card">
    <div class="card-header">
        <h3 class="card-title">观点列表</h3>
        <div>
            <input type="text" id="search-input" placeholder="搜索观点..." style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; margin-right: 10px; width: 250px;">
            <button class="btn btn-secondary" onclick="loadClaims()">🔄 刷新</button>
        </div>
    </div>
    <div id="claims-loading" class="loading">加载中...</div>
    <div id="claims-container" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%">#</th>
                    <th style="width: 30%">观点标题</th>
                    <th style="width: 35%">内容</th>
                    <th style="width: 10%">极性</th>
                    <th style="width: 20%">来源</th>
                </tr>
            </thead>
            <tbody id="claims-tbody"></tbody>
        </table>
    </div>
    <div id="claims-empty" class="empty-state" style="display: none;">
        <div class="empty-state-icon">💬</div>
        <p>暂无观点数据</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function() {
    let allClaims = [];
    window.loadClaims = async function() {
        const loading = document.getElementById('claims-loading');
        const container = document.getElementById('claims-container');
        const empty = document.getElementById('claims-empty');
        loading.style.display = 'block';
        container.style.display = 'none';
        empty.style.display = 'none';
        try {
            const data = await apiCall('/api/claims/list');
            allClaims = data.data;
            loading.style.display = 'none';
            if (allClaims.length === 0) {
                empty.style.display = 'block';
                return;
            }
            renderClaims(allClaims);
        } catch (error) {
            loading.style.display = 'none';
            empty.style.display = 'block';
            showToast('加载失败: ' + error.message, 'error');
        }
    };
    function renderClaims(claims) {
        const container = document.getElementById('claims-container');
        const tbody = document.getElementById('claims-tbody');
        container.style.display = 'block';
        tbody.innerHTML = claims.map((claim, index) => {
            const polarityBadge = claim.polarity === '支持' ? '<span class="badge badge-success">✓ 支持</span>' : claim.polarity === '反驳' ? '<span class="badge badge-danger">✗ 反驳</span>' : '<span class="badge badge-info">○ 中立</span>';
            return `<tr><td>${index + 1}</td><td><strong>${claim.title || '未命名'}</strong></td><td style="font-size: 13px; color: #666;">${(claim.content || '').substring(0, 100)}...</td><td>${polarityBadge}</td><td style="font-size: 12px;">${claim.source || '未知'}</td></tr>`;
        }).join('');
    }
    document.getElementById('search-input').addEventListener('input', (e) => {
        const keyword = e.target.value.toLowerCase();
        const filtered = allClaims.filter(claim => (claim.title || '').toLowerCase().includes(keyword) || (claim.content || '').toLowerCase().includes(keyword) || (claim.source || '').toLowerCase().includes(keyword));
        renderClaims(filtered);
    });
    loadClaims();
})();
</script>
{% endblock %}
